name: publish-image

run-name: 'nankeep ${{ github.ref_name }} · 发布镜像'

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 测试（stdlib 单测 + 端到端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 语法检查
        run: |
          python -m py_compile nankeep.py nankeep_web.py
          echo "py_compile OK"
      - name: 单元测试（会话/CSRF/互斥/守卫/fail-safe/渲染/解析）
        run: python -m unittest discover -s tests -v
      - name: 端到端测试（HTTP 全链路 + 真删 + 一次性 + 审计）
        run: python tests/e2e.py

  build:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解析镜像名与版本
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ver="${tag#v}" ;;
            *)  ver="dev-$(git rev-parse --short HEAD)" ;;
          esac
          echo "value=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
